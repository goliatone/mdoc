version: 3
project_id: replace-with-a-unique-project-id
default_profile: work
profiles:
  work:
    sources:
      include: [docs/engagement/*.md]
    entry: engagement-report
    field_defaults:
      classification: Internal
    publications:
      engagement-report:
        kind: bundle
        title: Engagement Report
        field_files: [private/engagement-fields.yaml]
        reference_links:
          - id: operations
            pattern: '\bOP[0-9]{2}\b'
            definition:
              source: docs/engagement/11_OPERATIONS_PROPOSAL.md
              match: heading_prefix
            unresolved: error
        members:
          - source: docs/engagement/01_DISCOVERY.md
            start: after_cover
          - source: docs/engagement/02_INTAKE_APP_AUDIT.md
            start: new_page
          - source: docs/engagement/03_PRODUCTION_APP_AUDIT.md
            start: new_page
          - source: docs/engagement/04_SCHEDULING_APP_AUDIT.md
            start: new_page
          - source: docs/engagement/05_GITHUB_DEPLOYMENT_AUDIT.md
            start: new_page
          - source: docs/engagement/06_VERCEL_AUDIT.md
            start: new_page
          - source: docs/engagement/07_SUPABASE_AUDIT.md
            start: new_page
          - source: docs/engagement/08_SECURITY_ASSESSMENT.md
            start: new_page
          - source: docs/engagement/09_BEST_PRACTICES.md
            start: new_page
          - source: docs/engagement/09_BEST_PRACTICES_APPENDIX.md
            start: new_page
            appendix: true
            appendix_prefix: Appendix
          - source: docs/engagement/10_AUTH_ARCHITECTURE.md
            start: new_page
          - source: docs/engagement/11_OPERATIONS_PROPOSAL.md
            start: new_page
          - source: docs/engagement/12_FINAL_REPORT.md
            start: new_page
        layout:
          cover:
            enabled: true
            title: Engagement Report
            fields:
              - key: classification
                label: Classification
          table_of_contents:
            enabled: true
            mode: static
            depth: 3
          page:
            size: letter
            margins:
              top: 1in
              right: 1in
              bottom: 1in
              left: 1in
          footer:
            mode: override
            right: 'Page {{ page "number" }} of {{ page "count" }}'
    style:
      reference_docx: document-styles/work-reference.docx
      heading_filter: none
      filters: []
      roots: [document-styles]
      reader: gfm
    destination:
      staging_folder_name: Momentum Engagement Staging
      review_folder_name: Momentum Engagement Review
    state_file: private/mdoc-state.json
